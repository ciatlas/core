name: PR title
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  title:
    # Squash merges use the pull request title as the commit message, and release-please reads those commits.
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([a-z0-9][a-z0-9-]*\))?!?: [^ ].*$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::The pull request title must follow Conventional Commits, e.g. 'fix(graph): follow step env reads'. Types: feat, fix, perf, refactor, docs, test, build, ci, chore, revert, style; '!' marks a breaking change. Retitle GitHub's Revert PRs as 'revert: ...'."
            exit 1
          fi
