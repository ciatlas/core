name: Release
# Every push to main updates the release pull request (version bump and changelog from Conventional Commits).
# Merging it tags the release (vX.Y.Z) and creates the GitHub release. Nothing is published to a registry: consumers
# depend on the tag (`github:ciatlas/core#vX.Y.Z`), and immutable releases keep the tag where it was released.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    # Writes go through the ciatlas-release-bot app: unlike GITHUB_TOKEN, its pull requests start the usual workflows,
    # so the release pull request gets the required checks like any other.
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
