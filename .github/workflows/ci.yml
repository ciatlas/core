name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm coverage

  fallow:
    # Code health (fallow.tools, policy in .fallowrc.jsonc): no unused files, exports or dependencies and no duplicated
    # code anywhere, and a pull request adds no complex, duplicated or unused code compared with its base.
    name: Code health
    runs-on: ubuntu-latest
    env:
      FALLOW_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The audit compares the pull request with its base branch.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec fallow dead-code
      - run: pnpm exec fallow dupes
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec fallow audit --base "origin/$BASE_REF"

  workflows:
    # This repository's own workflows, checked by flowpact (which is built on this package).
    name: Workflows (flowpact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ciatlas/flowpact@dbb0e59b4477086c55ed5572256e3888482b20c5 # v0.28.0
        with:
          mode: lint
          fail-on: warning

  zizmor:
    # Workflow security (zizmor.sh): template injection, credentials left in the checkout, cache poisoning, unpinned or
    # impostor actions and more. Findings fail the job and annotate the pull request.
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: .github/workflows
          version: 1.30.1
          advanced-security: false
          annotations: true

  ci-passed:
    # The only required status check: add new jobs to `needs` instead of changing the branch rules.
    name: CI passed
    if: always()
    needs: [test, fallow, workflows, zizmor]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
